<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d">
  <title id="t">How PAI is built</title>
  <desc id="d">Five layers: you start pai or pai --claude in a terminal; OpenCode or Claude Code runs, each pinned and smoke-tested; an adapter per engine translates its events; pai-core handles them without importing any engine SDK; skills, agents, memory and settings live in one git repository both engines share.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .layer { fill: #64748b; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
      .h { fill: #f1f5f9; font-size: 21px; font-weight: 700; }
      .s { fill: #94a3b8; font-size: 15px; }
      .p { fill: #67e8f9; font-size: 14px; }
      .eng { fill: #160f2e; stroke: #a78bfa; stroke-width: 2; }
      .ada { fill: #111a33; stroke: #6366f1; stroke-width: 1.5; }
      .core { fill: #0b1a2e; stroke: #22d3ee; stroke-width: 2.5; }
      .state { fill: #0d1f1c; stroke: #34d399; stroke-width: 2; }
      .tag rect { fill: #1e1b4b; stroke: #818cf8; }
      .tag text { fill: #c7d2fe; font-size: 13px; text-anchor: middle; }
      .hc rect { fill: #0f2236; stroke: #0e7490; }
      .hc text { fill: #cffafe; font-size: 14px; text-anchor: middle; }
      .sc rect { fill: #0f2a24; stroke: #059669; }
      .sc .n { fill: #d1fae5; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .sc .s2 { fill: #6ee7b7; font-size: 13px; text-anchor: middle; }
      .flow { stroke: #67e8f9; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1280" height="780" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="780" rx="18" fill="url(#grid)" opacity="0.6"/>

  <g class="sans">
    <text x="48" y="54" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="4">HOW PAI IS BUILT</text>
    <text x="48" y="82" fill="#cbd5e1" font-size="19">Two engines on top of one core. Everything below the engines is shared.</text>
  </g>

  <!-- layer labels -->
  <g class="sans layer">
    <text x="48" y="146">YOU</text>
    <text x="48" y="246">ENGINES</text>
    <text x="48" y="362">ADAPTERS</text>
    <text x="48" y="478">CORE</text>
    <text x="48" y="626">STATE</text>
  </g>

  <!-- you: the terminal -->
  <rect x="400" y="112" width="480" height="58" rx="10" fill="#0f1830" stroke="#334155"/>
  <circle cx="420" cy="128" r="4" fill="#f87171"/><circle cx="434" cy="128" r="4" fill="#fbbf24"/><circle cx="448" cy="128" r="4" fill="#34d399"/>
  <g class="mono" font-size="17">
    <text x="424" y="156" fill="#34d399">$ <tspan fill="#e2e8f0">pai</tspan></text>
    <text x="528" y="156" fill="#34d399">$ <tspan fill="#e2e8f0">pai --claude</tspan></text>
    <text x="712" y="156" fill="#34d399">$ <tspan fill="#e2e8f0">pai doctor</tspan></text>
  </g>

  <path class="flow" d="M470 172 C470 190 380 186 380 206"/>
  <path class="flow" d="M590 172 C590 190 900 186 900 206"/>

  <!-- engines -->
  <g class="sans">
    <rect class="eng" x="180" y="210" width="400" height="80" rx="12"/>
    <text class="h" x="204" y="244">OpenCode</text>
    <text class="s" x="204" y="270">any model provider, free models to start</text>
    <rect class="eng" x="700" y="210" width="400" height="80" rx="12"/>
    <text class="h" x="724" y="244">Claude Code</text>
    <text class="s" x="724" y="270">Anthropic's engine, with a Claude subscription</text>
  </g>
  <g class="tag sans">
    <rect x="432" y="224" width="132" height="26" rx="13"/><text x="498" y="242">pinned exactly</text>
    <rect x="952" y="224" width="132" height="26" rx="13"/><text x="1018" y="242">pinned exactly</text>
  </g>

  <path class="flow" d="M380 292 V 322"/>
  <path class="flow" d="M900 292 V 322"/>

  <!-- adapters -->
  <g class="sans">
    <rect class="ada" x="180" y="326" width="400" height="74" rx="12"/>
    <text class="h" x="204" y="358" font-size="19">OpenCode adapter</text>
    <text class="p mono" x="204" y="384">.opencode/pai-adapters/opencode-v2/</text>
    <rect class="ada" x="700" y="326" width="400" height="74" rx="12"/>
    <text class="h" x="724" y="358" font-size="19">Claude plugin</text>
    <text class="p mono" x="724" y="384">claude-plugin/ · hooks · MCP server</text>
  </g>

  <path class="flow" d="M380 402 C380 424 560 420 560 442"/>
  <path class="flow" d="M900 402 C900 424 720 420 720 442"/>

  <!-- core -->
  <g class="sans">
    <rect class="core" x="180" y="446" width="920" height="116" rx="14"/>
    <text class="h" x="204" y="480">pai-core<tspan class="s" font-weight="400" dx="14">engine-independent: takes primitives, returns data, never imports an engine SDK</tspan></text>
  </g>
  <g class="hc sans">
    <rect x="204" y="502" width="136" height="34" rx="8"/><text x="272" y="524">security guard</text>
    <rect x="352" y="502" width="152" height="34" rx="8"/><text x="428" y="524">Algorithm tracker</text>
    <rect x="516" y="502" width="104" height="34" rx="8"/><text x="568" y="524">PRD sync</text>
    <rect x="632" y="502" width="146" height="34" rx="8"/><text x="705" y="524">learning capture</text>
    <rect x="790" y="502" width="136" height="34" rx="8"/><text x="858" y="524">session registry</text>
    <rect x="938" y="502" width="138" height="34" rx="8"/><text x="1007" y="524">… 25 handlers</text>
  </g>

  <path class="flow" d="M640 564 V 594"/>

  <!-- shared state -->
  <g class="sans">
    <rect class="state" x="180" y="598" width="920" height="146" rx="14"/>
    <text class="h" x="204" y="632">One git repository<tspan class="s" font-weight="400" dx="14">shared by both engines; every change can be seen and undone</tspan></text>
  </g>
  <g class="sc sans">
    <rect x="204" y="654" width="206" height="68" rx="10"/><text class="n" x="307" y="684">Skills</text><text class="s2" x="307" y="706">about 50, by name</text>
    <rect x="426" y="654" width="206" height="68" rx="10"/><text class="n" x="529" y="684">Agents</text><text class="s2" x="529" y="706">researchers, engineer …</text>
    <rect x="648" y="654" width="206" height="68" rx="10"/><text class="n" x="751" y="684">Memory</text><text class="s2" x="751" y="706">work, learning, wisdom</text>
    <rect x="870" y="654" width="206" height="68" rx="10"/><text class="n" x="973" y="684">Settings &amp; rules</text><text class="s2" x="973" y="706">who it is, what it may do</text>
  </g>

  <!-- self-test rail -->
  <g class="sans">
    <path d="M1126 214 H1146 V396 H1126" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text transform="translate(1178 305) rotate(90)" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700" letter-spacing="3">SELF-TEST</text>
    <text transform="translate(1204 305) rotate(90)" text-anchor="middle" fill="#fde68a" font-size="12">before start: version and smoke receipt</text>
  </g>
</svg>
