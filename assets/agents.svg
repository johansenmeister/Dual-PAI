<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Agents</title>
  <desc id="d">Your PAI session hands work to seventeen agents in four groups. Build: Architect, Engineer, Designer, Artist, Writer. Check: QATester, UIReviewer, Pentester. General: Algorithm, Intern, BrowserAgent. Research: DeepResearcher, and five researchers on their own model families (Claude, Grok, Kimi, Qwen Max, DeepSeek Flash) that exist only in OpenCode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .lbl { fill: #22d3ee; font-size: 15px; font-weight: 700; letter-spacing: 4px; }
      .sub { fill: #cbd5e1; font-size: 19px; }
      .h { fill: #f1f5f9; font-size: 19px; font-weight: 700; }
      .hc { fill: #f1f5f9; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 14px; }
      .sc { fill: #94a3b8; font-size: 14px; text-anchor: middle; }
      .t { fill: #e2e8f0; font-size: 15px; }
      .tc { fill: #e2e8f0; font-size: 15px; text-anchor: middle; }
      .flow { stroke: #67e8f9; stroke-width: 2.2; fill: none; marker-end: url(#arr); }
      .soft { stroke: #67e8f9; stroke-opacity: 0.5; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="18" fill="url(#grid)" opacity="0.6"/>
  <g class="sans">
    <text class="lbl" x="48" y="54">AGENTS</text>
    <text class="sub" x="48" y="82">Seventeen specialists. In OpenCode each one runs on its own model.</text>
  </g>
  <g class="sans">
    <rect x="470" y="108" width="340" height="64" rx="12" fill="#0f1830" stroke="#fbbf24" stroke-width="2"/>
    <text class="hc" x="640" y="136">Your PAI session</text>
    <text class="sc" x="640" y="158">hands work out, checks what comes back</text>
    <path class="soft" d="M640 174 C 640 196 188.0 192 188.0 214"/>
    <rect x="48" y="216" width="280" height="40" rx="12" fill="#0f1830" stroke="#a78bfa" stroke-width="2"/>
    <text class="hc" x="188.0" y="242" font-size="17">Build</text>
    <rect x="48" y="270" width="280" height="48" rx="10" fill="#0b1328" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="68" cy="294" r="5" fill="#a78bfa"/>
    <text class="t" x="84" y="291" font-weight="700">Architect</text>
    <text class="s" x="84" y="309" font-size="13">system design and plans</text>
    <rect x="48" y="326" width="280" height="48" rx="10" fill="#0b1328" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="68" cy="350" r="5" fill="#a78bfa"/>
    <text class="t" x="84" y="347" font-weight="700">Engineer</text>
    <text class="s" x="84" y="365" font-size="13">implementation, test first</text>
    <rect x="48" y="382" width="280" height="48" rx="10" fill="#0b1328" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="68" cy="406" r="5" fill="#a78bfa"/>
    <text class="t" x="84" y="403" font-weight="700">Designer</text>
    <text class="s" x="84" y="421" font-size="13">UX and UI</text>
    <rect x="48" y="438" width="280" height="48" rx="10" fill="#0b1328" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="68" cy="462" r="5" fill="#a78bfa"/>
    <text class="t" x="84" y="459" font-weight="700">Artist</text>
    <text class="s" x="84" y="477" font-size="13">images</text>
    <rect x="48" y="494" width="280" height="48" rx="10" fill="#0b1328" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="68" cy="518" r="5" fill="#a78bfa"/>
    <text class="t" x="84" y="515" font-weight="700">Writer</text>
    <text class="s" x="84" y="533" font-size="13">docs and technical writing</text>
    <path class="soft" d="M640 174 C 640 196 489.0 192 489.0 214"/>
    <rect x="349" y="216" width="280" height="40" rx="12" fill="#0f1830" stroke="#f87171" stroke-width="2"/>
    <text class="hc" x="489.0" y="242" font-size="17">Check</text>
    <rect x="349" y="270" width="280" height="48" rx="10" fill="#0b1328" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="369" cy="294" r="5" fill="#f87171"/>
    <text class="t" x="385" y="291" font-weight="700">QATester</text>
    <text class="s" x="385" y="309" font-size="13">proves it works before done</text>
    <rect x="349" y="326" width="280" height="48" rx="10" fill="#0b1328" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="369" cy="350" r="5" fill="#f87171"/>
    <text class="t" x="385" y="347" font-weight="700">UIReviewer</text>
    <text class="s" x="385" y="365" font-size="13">user stories in a browser</text>
    <rect x="349" y="382" width="280" height="48" rx="10" fill="#0b1328" stroke="#f87171" stroke-width="1.5"/>
    <circle cx="369" cy="406" r="5" fill="#f87171"/>
    <text class="t" x="385" y="403" font-weight="700">Pentester</text>
    <text class="s" x="385" y="421" font-size="13">security assessments</text>
    <path class="soft" d="M640 174 C 640 196 790.0 192 790.0 214"/>
    <rect x="650" y="216" width="280" height="40" rx="12" fill="#0f1830" stroke="#22d3ee" stroke-width="2"/>
    <text class="hc" x="790.0" y="242" font-size="17">General</text>
    <rect x="650" y="270" width="280" height="48" rx="10" fill="#0b1328" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="670" cy="294" r="5" fill="#22d3ee"/>
    <text class="t" x="686" y="291" font-weight="700">Algorithm</text>
    <text class="s" x="686" y="309" font-size="13">Ideal State Criteria</text>
    <rect x="650" y="326" width="280" height="48" rx="10" fill="#0b1328" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="670" cy="350" r="5" fill="#22d3ee"/>
    <text class="t" x="686" y="347" font-weight="700">Intern</text>
    <text class="s" x="686" y="365" font-size="13">broad, open problems</text>
    <rect x="650" y="382" width="280" height="48" rx="10" fill="#0b1328" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="670" cy="406" r="5" fill="#22d3ee"/>
    <text class="t" x="686" y="403" font-weight="700">BrowserAgent</text>
    <text class="s" x="686" y="421" font-size="13">browser work in parallel</text>
    <path class="soft" d="M640 174 C 640 196 1091.0 192 1091.0 214"/>
    <rect x="951" y="216" width="280" height="40" rx="12" fill="#0f1830" stroke="#34d399" stroke-width="2"/>
    <text class="hc" x="1091.0" y="242" font-size="17">Research</text>
    <rect x="951" y="270" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="971" cy="294" r="5" fill="#34d399"/>
    <text class="t" x="987" y="291" font-weight="700">DeepResearcher</text>
    <text class="s" x="987" y="309" font-size="13">main profile's model</text>
    <rect x="951" y="326" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="971" cy="350" r="5" fill="#34d399"/>
    <text class="t" x="987" y="347" font-weight="700">ClaudeResearcher</text>
    <text class="s" x="987" y="365" font-size="13">Claude</text>
    <rect x="951" y="382" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="971" cy="406" r="5" fill="#34d399"/>
    <text class="t" x="987" y="403" font-weight="700">GrokResearcher</text>
    <text class="s" x="987" y="421" font-size="13">Grok</text>
    <rect x="951" y="438" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="971" cy="462" r="5" fill="#34d399"/>
    <text class="t" x="987" y="459" font-weight="700">CodexResearcher</text>
    <text class="s" x="987" y="477" font-size="13">Kimi</text>
    <rect x="951" y="494" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="971" cy="518" r="5" fill="#34d399"/>
    <text class="t" x="987" y="515" font-weight="700">GeminiResearcher</text>
    <text class="s" x="987" y="533" font-size="13">Qwen Max</text>
    <rect x="951" y="550" width="280" height="48" rx="10" fill="#0b1328" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="971" cy="574" r="5" fill="#34d399"/>
    <text class="t" x="987" y="571" font-weight="700">PerplexityResearcher</text>
    <text class="s" x="987" y="589" font-size="13">DeepSeek Flash</text>
    <rect x="48" y="588" width="30" height="20" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="s" x="90" y="603">OpenCode only. Under Claude Code the other twelve run on Claude models.</text>
  </g>
</svg>
