<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Dual-PAI: a personal AI assistant in your terminal</title>
  <desc id="d">The PAI core of skills, agents, memory, the Algorithm, a security guard and a self-test, shared by two engines: OpenCode and Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#0e7490" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0f1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .chip rect { fill: #0f1830; stroke: #22d3ee; stroke-width: 1.5; }
      .chip text { fill: #e2e8f0; font-size: 17px; text-anchor: middle; }
      .link { stroke: #22d3ee; stroke-opacity: 0.45; stroke-width: 1.5; fill: none; }
      .eng rect { fill: #160f2e; stroke: #a78bfa; stroke-width: 2; }
      .eng .n { fill: #ede9fe; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .eng .s { fill: #a5b4fc; font-size: 13px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>
  <g transform="translate(0 100)">

  
  

  <!-- left: name and promise -->
  <g class="sans">
    <text x="64" y="112" fill="#22d3ee" font-size="15" font-weight="700" letter-spacing="4">PERSONAL AI INFRASTRUCTURE</text>
    <text x="60" y="210" fill="#f8fafc" font-size="104" font-weight="800" letter-spacing="2" filter="url(#glow)">PAI</text>
    <text x="64" y="256" fill="#cbd5e1" font-size="25">a personal AI assistant in your terminal</text>
    <text x="64" y="294" fill="#94a3b8" font-size="18">One set of skills, memory and rules. Two engines.</text>
  </g>
  <g class="mono" font-size="17">
    <rect x="64" y="330" width="96" height="40" rx="8" fill="#0f1830" stroke="#334155"/>
    <text x="80" y="356" fill="#34d399">$ <tspan fill="#e2e8f0">pai</tspan></text>
    <rect x="176" y="330" width="176" height="40" rx="8" fill="#0f1830" stroke="#334155"/>
    <text x="192" y="356" fill="#34d399">$ <tspan fill="#e2e8f0">pai --claude</tspan></text>
  </g>

  <!-- right: the core with its parts and the two engines -->
  <g class="links">
    <path class="link" d="M920 220 L760 82"/>
    <path class="link" d="M920 220 L920 82"/>
    <path class="link" d="M920 220 L1080 82"/>
    <path class="link" d="M920 220 L760 358"/>
    <path class="link" d="M920 220 L920 358"/>
    <path class="link" d="M920 220 L1080 358"/>
  </g>

  <circle cx="920" cy="220" r="150" fill="url(#core)"/>
  <circle cx="920" cy="220" r="74" fill="#0b1328" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="920" cy="220" r="88" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-dasharray="4 7"/>
  <g class="sans" text-anchor="middle">
    <text x="920" y="216" fill="#f8fafc" font-size="30" font-weight="800">PAI</text>
    <text x="920" y="242" fill="#67e8f9" font-size="14" letter-spacing="2">CORE</text>
  </g>

  <g class="chip sans">
    <rect x="696" y="62" width="128" height="40" rx="20"/><text x="760" y="88">Skills</text>
    <rect x="856" y="62" width="128" height="40" rx="20"/><text x="920" y="88">Agents</text>
    <rect x="1000" y="62" width="160" height="40" rx="20"/><text x="1080" y="88">The Algorithm</text>
    <rect x="696" y="338" width="128" height="40" rx="20"/><text x="760" y="364">Memory</text>
    <rect x="856" y="338" width="128" height="40" rx="20"/><text x="920" y="364">Security</text>
    <rect x="1016" y="338" width="128" height="40" rx="20"/><text x="1080" y="364">Self-test</text>
  </g>

  <!-- engines -->
  <path d="M846 220 H 760 M994 220 H 1080" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="10"/>
  <path d="M846 220 H 760 M994 220 H 1080" stroke="#c4b5fd" stroke-width="2.5"/>
  <g class="eng sans">
    <rect x="600" y="188" width="164" height="64" rx="12"/>
    <text class="n" x="682" y="218">OpenCode</text>
    <text class="s" x="682" y="238">any model provider</text>
    <rect x="1076" y="188" width="164" height="64" rx="12"/>
    <text class="n" x="1158" y="218">Claude Code</text>
    <text class="s" x="1158" y="238">Claude subscription</text>
  </g>
  </g>
  <g class="sans">
    <text x="64" y="84" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="1">Dual-PAI</text>
    <text x="1216" y="84" fill="#64748b" font-size="18" text-anchor="end">OpenCode · Claude Code · MIT</text>
    <path d="M64 572 H1216" stroke="#1e2a4a" stroke-width="2"/>
    <text x="64" y="604" fill="#94a3b8" font-size="18">Skills · agents · multi-model research · memory · the Algorithm, in one git repository</text>
  </g>
</svg>
