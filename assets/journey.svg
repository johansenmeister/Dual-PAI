<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
  <title id="t">From install to every day</title>
  <desc id="d">Three steps: install.sh installs git, Bun and both engines and picks a free model; the setup conversation in SETUP.md walks through language, name, engine and models, machines, services and keys; after that you start pai every day, and pai doctor says what to fix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .card { fill: #0f1830; stroke: #22d3ee; stroke-width: 2; }
      .num { fill: #0a0f1f; stroke: #22d3ee; stroke-width: 2; }
      .n { fill: #67e8f9; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .h { fill: #f1f5f9; font-size: 21px; font-weight: 700; }
      .c { fill: #e2e8f0; font-size: 15px; }
      .s { fill: #94a3b8; font-size: 15px; }
      .note { fill: #fcd34d; font-size: 14px; }
      .flow { stroke: #67e8f9; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)" opacity="0.6"/>

  <g class="sans">
    <rect class="card" x="40" y="44" width="360" height="212" rx="14"/>
    <circle class="num" cx="76" cy="82" r="20"/><text class="n" x="76" y="88">1</text>
    <text class="h" x="108" y="90">Install</text>
    <rect x="64" y="114" width="312" height="34" rx="8" fill="#0a0f1f" stroke="#334155"/>
    <text class="c mono" x="78" y="137"><tspan fill="#34d399">$</tspan> curl … install.sh | bash</text>
    <text class="s" x="64" y="178">checks the system, installs git, Bun</text>
    <text class="s" x="64" y="200">and both engines, picks a free model</text>
    <text class="note" x="64" y="236">no account, no API key</text>

    <path class="flow" d="M408 150 H 450"/>

    <rect class="card" x="460" y="44" width="360" height="212" rx="14"/>
    <circle class="num" cx="496" cy="82" r="20"/><text class="n" x="496" y="88">2</text>
    <text class="h" x="528" y="90">Setup conversation</text>
    <rect x="484" y="114" width="312" height="34" rx="8" fill="#0a0f1f" stroke="#334155"/>
    <text class="c mono" x="498" y="137">SETUP.md, one step at a time</text>
    <text class="s" x="484" y="178">language, name and personality, engine</text>
    <text class="s" x="484" y="200">and models, machines, services and keys</text>
    <text class="note" x="484" y="236">skip a step, come back later</text>

    <path class="flow" d="M828 150 H 870"/>

    <rect class="card" x="880" y="44" width="360" height="212" rx="14"/>
    <circle class="num" cx="916" cy="82" r="20"/><text class="n" x="916" y="88">3</text>
    <text class="h" x="948" y="90">Every day</text>
    <rect x="904" y="114" width="312" height="34" rx="8" fill="#0a0f1f" stroke="#334155"/>
    <text class="c mono" x="918" y="137"><tspan fill="#34d399">$</tspan> pai<tspan fill="#34d399" dx="28">$</tspan> pai --claude</text>
    <text class="s" x="904" y="178"><tspan class="mono" fill="#e2e8f0">pai doctor</tspan> checks the installation</text>
    <text class="s" x="904" y="200">and says what to fix</text>
    <text class="note" x="904" y="236">it changes nothing</text>
  </g>
</svg>
