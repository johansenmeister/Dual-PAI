<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">Security</title>
  <desc id="d">Every tool call from either engine passes the security guard in pai-core, which checks for prompt injection in seven categories, matches the command the shell will actually run, and checks file paths for credentials. The outcome is allowed, asks you first (such as git push --force), or blocked (such as rm -rf / or a write to .env). Every decision is logged with secrets redacted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121c38"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .lbl { fill: #22d3ee; font-size: 15px; font-weight: 700; letter-spacing: 4px; }
      .sub { fill: #cbd5e1; font-size: 19px; }
      .h { fill: #f1f5f9; font-size: 19px; font-weight: 700; }
      .hc { fill: #f1f5f9; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .s { fill: #94a3b8; font-size: 14px; }
      .sc { fill: #94a3b8; font-size: 14px; text-anchor: middle; }
      .t { fill: #e2e8f0; font-size: 15px; }
      .tc { fill: #e2e8f0; font-size: 15px; text-anchor: middle; }
      .flow { stroke: #67e8f9; stroke-width: 2.2; fill: none; marker-end: url(#arr); }
      .soft { stroke: #67e8f9; stroke-opacity: 0.5; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="18" fill="url(#grid)" opacity="0.6"/>
  <g class="sans">
    <text class="lbl" x="48" y="54">SECURITY</text>
    <text class="sub" x="48" y="82">Every tool call is checked before it runs, under both engines.</text>
  </g>
  <g class="sans">
    <rect x="48" y="214" width="210" height="92" rx="12" fill="#0f1830" stroke="#fbbf24" stroke-width="2"/>
    <text class="hc" x="153" y="250">a tool call</text>
    <text class="sc" x="153" y="274">from either engine</text>
    <text class="sc" x="153" y="294">shell, write, edit, MCP</text>
    <path class="flow" d="M262 260 H 314"/>
    <rect x="320" y="124" width="420" height="272" rx="14" fill="#0b1a2e" stroke="#22d3ee" stroke-width="2.5"/>
    <text class="hc" x="530" y="158">security guard</text>
    <text class="sc mono" x="530" y="180">pai-core</text>
    <rect x="340" y="198" width="380" height="56" rx="10" fill="#0f2236" stroke="#0e7490" stroke-width="1.5"/>
    <text class="t" x="358" y="222" font-weight="700"><tspan fill="#67e8f9">1</tspan>  Prompt injection</text>
    <text class="s" x="358" y="242">7 categories, in the text of the call</text>
    <rect x="340" y="262" width="380" height="56" rx="10" fill="#0f2236" stroke="#0e7490" stroke-width="1.5"/>
    <text class="t" x="358" y="286" font-weight="700"><tspan fill="#67e8f9">2</tspan>  Shell command</text>
    <text class="s" x="358" y="306">what the shell will run, not text it stores</text>
    <rect x="340" y="326" width="380" height="56" rx="10" fill="#0f2236" stroke="#0e7490" stroke-width="1.5"/>
    <text class="t" x="358" y="350" font-weight="700"><tspan fill="#67e8f9">3</tspan>  File path</text>
    <text class="s" x="358" y="370">writes to credentials, keys, .env, ~/.ssh/</text>
    <path class="soft" d="M744 260 C 780 260 780 162 816 162" marker-end="url(#arr)"/>
    <rect x="820" y="124" width="412" height="76" rx="12" fill="#0d1f1c" stroke="#34d399" stroke-width="2"/>
    <text class="h" x="842" y="156" fill="#34d399">allowed</text>
    <text class="mono" x="842" y="182" fill="#e2e8f0" font-size="14">ls -la · bun test</text>
    <path class="soft" d="M744 260 C 780 260 780 260 816 260" marker-end="url(#arr)"/>
    <rect x="820" y="222" width="412" height="76" rx="12" fill="#2a2210" stroke="#fbbf24" stroke-width="2"/>
    <text class="h" x="842" y="254" fill="#fbbf24">asks you first</text>
    <text class="mono" x="842" y="280" fill="#e2e8f0" font-size="14">git push --force · git reset --hard</text>
    <path class="soft" d="M744 260 C 780 260 780 358 816 358" marker-end="url(#arr)"/>
    <rect x="820" y="320" width="412" height="76" rx="12" fill="#2a1215" stroke="#f87171" stroke-width="2"/>
    <text class="h" x="842" y="352" fill="#f87171">blocked</text>
    <text class="mono" x="842" y="378" fill="#e2e8f0" font-size="14">rm -rf / · a write to .env</text>
    <path d="M48 458 H1232" stroke="#1e2a4a" stroke-width="2"/>
    <text class="t" x="48" y="490"><tspan fill="#22d3ee" font-weight="700">Every decision is logged</tspan> in STATE/, with secrets redacted. A block names the pattern that matched.</text>
  </g>
</svg>
